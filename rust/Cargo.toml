[package]
name = "pocketbridge"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
ureq = { version = "2.12", features = ["cookies"] }
url = "2"
regex = "1"
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
