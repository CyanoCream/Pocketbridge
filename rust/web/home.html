<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon.svg">
<title>PocketBridge</title>
<style>
:root{--bg:#f4f5f9;--hover:#e7e9f0;--text:#1d1d1f;--muted:#6e6e73;--line:#dfe2ea;--chip:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1c1d22;--hover:#2b2d35;--text:#eef0f6;--muted:#9a9db0;--line:#33353f;--chip:#25262e}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0 24px}
.brand{width:48px;height:48px;border-radius:14px;box-shadow:0 8px 24px #0003}
h1{margin:12px 0 4px;font-size:22px;font-weight:600;text-align:center}
.sub{margin:0;color:var(--muted);font-size:13.5px;text-align:center}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:860px;margin-top:100px}
.tile{width:148px;padding:22px 8px 16px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:14px;
  text-decoration:none;color:inherit;cursor:pointer;transition:background .15s,transform .15s}
.tile:hover{background:var(--hover)}
.tile:active{transform:scale(.97)}
.tile b{font-size:15px;font-weight:600}
.ic{font-size:84px;width:1em;height:1em;border-radius:50%;position:relative;display:block;flex:none}
.ic svg{width:100%;height:100%;display:block}
.ic-chrome{background:conic-gradient(from -60deg,#EA4335 0 120deg,#FBBC05 0 240deg,#34A853 0)}
.ic-chrome:after{content:"";position:absolute;inset:27%;border-radius:50%;background:#4285F4;box-shadow:0 0 0 .08em #fff}
.ic-edge{background:linear-gradient(135deg,#35C1F1,#0C59A4 55%,#2BC56B)}
.ic-edge:after{content:"";position:absolute;left:29%;top:37%;width:54%;height:37%;border-radius:50%/60% 60% 40% 40%;background:#fff;opacity:.92}
.ic-brave{border-radius:22% 22% 40% 40%;background:linear-gradient(160deg,#FF7A4D,#FB542B 60%,#D6361B);clip-path:polygon(18% 0,82% 0,100% 22%,92% 70%,50% 100%,8% 70%,0 22%)}
.ic-brave:after{content:"";position:absolute;left:31%;top:28%;width:38%;height:42%;background:#fff;clip-path:polygon(50% 100%,0 25%,25% 0,75% 0,100% 25%)}
.ic-firefox{background:conic-gradient(from 200deg,#FF980E,#FFBD4F,#FF3750,#9059FF,#FF980E)}
.ic-firefox:after{content:"";position:absolute;inset:23%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7542E5,#3A1F8C)}
footer{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;padding:14px 16px;
  font-size:13px;color:var(--muted)}
footer a,footer button{color:var(--muted);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:0}
footer a:hover,footer button:hover{color:var(--text)}
footer code{font:12.5px ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);padding:2px 7px;border-radius:6px}
@media (max-width:520px){.grid{gap:2px}.tile{width:31%;padding:16px 4px 12px;gap:10px}.ic{font-size:64px}.tile b{font-size:13.5px}h1{font-size:20px}.brand{width:42px;height:42px;border-radius:12px}.grid{margin-top:72px}}
.toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.2s;max-width:92vw;
  background:var(--chip);border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px #0003}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{color:#7c5cff;font-weight:600}
</style>
</head>
<body>
<main>
<img class="brand" src="/icon.svg" alt="">
<h1>PocketBridge</h1>
<p class="sub" id="sub"></p>

<div class="grid">
  <a class="tile" href="/notes">
    <span class="ic"><svg viewBox="0 0 84 84"><rect width="84" height="84" rx="20" fill="#fff"/><path d="M0 20A20 20 0 0 1 20 0h44a20 20 0 0 1 20 20v6H0z" fill="#FFCC00"/><path d="M16 42h52M16 54h52M16 66h34" stroke="#C7C7CC" stroke-width="4" stroke-linecap="round"/></svg></span>
    <b>Catatan</b>
  </a>
  <a class="tile" data-b="chrome"><span class="ic ic-chrome"></span><b>Chrome</b></a>
  <a class="tile" data-b="edge"><span class="ic ic-edge"></span><b>Edge</b></a>
  <a class="tile" data-b="brave"><span class="ic ic-brave"></span><b>Brave</b></a>
  <a class="tile" data-b="firefox"><span class="ic ic-firefox"></span><b>Firefox</b></a>
  <a class="tile" href="/gateway">
    <span class="ic"><svg viewBox="0 0 84 84"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22C7E8"/></linearGradient></defs><circle cx="42" cy="42" r="42" fill="url(#g)"/><path d="M42 18l5.5 18.5L66 42l-18.5 5.5L42 66l-5.5-18.5L18 42l18.5-5.5z" fill="#fff"/></svg></span>
    <b>AI Gateway</b>
  </a>
  <a class="tile" href="/setup">
    <span class="ic"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="42" fill="#6B6F7D"/><circle cx="26" cy="42" r="5.5" fill="#fff"/><circle cx="42" cy="42" r="5.5" fill="#fff"/><circle cx="58" cy="42" r="5.5" fill="#fff"/></svg></span>
    <b>Lainnya</b>
  </a>
</div>
</main>

<footer>
  <span>Proxy <code id="proxy"></code></span>
  <span>AI Gateway <code id="gw"></code></span>
  <a href="/launch/PocketBridge-Setup.bat" id="setup">Pasang launcher (sekali saja)</a>
  <a href="/logout" id="logout" hidden>Keluar</a>
</footer>
<div class="toast" id="toast"></div>

<script>
const host = location.hostname;
const isWin = /Windows/i.test(navigator.userAgent);
const $ = id => document.getElementById(id);
$('proxy').textContent = host + ':8888';
$('gw').textContent = 'http://' + host + ':8090';
$('sub').textContent = host;
if (!isWin) $('setup').hidden = true;

let toastTimer;
function toast(html, ms = 6000) {
  const t = $('toast'); t.innerHTML = html; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

// Browser tiles use the pocketbridge:// link registered by the Windows launcher (setup).
document.querySelectorAll('[data-b]').forEach(a => {
  if (!isWin) { a.href = '/setup'; return; }
  a.href = `pocketbridge://${a.dataset.b}/?host=${encodeURIComponent(host)}`;
  a.addEventListener('click', () => {
    let opened = false;
    const onBlur = () => { opened = true; };
    window.addEventListener('blur', onBlur, { once: true });
    setTimeout(() => {
      window.removeEventListener('blur', onBlur);
      if (!opened) toast('Browser tidak terbuka? <a href="/launch/PocketBridge-Setup.bat">Pasang launcher</a> dulu (sekali saja), lalu klik lagi.');
    }, 4000);
  });
});

// Copy proxy / gateway address on click.
['proxy', 'gw'].forEach(id => $(id).addEventListener('click', () => {
  const r = document.createRange(); r.selectNodeContents($(id));
  const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges();
  toast('Disalin: ' + $(id).textContent, 1800);
}));

fetch('/api/config', { cache: 'no-store' }).then(r => r.json()).then(c => { $('logout').hidden = !c.hasPassword; }).catch(() => {});
</script>
</body>
</html>
