<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon.svg">
<title>Catatan · PocketBridge</title>
<style>
:root{--bg:#f5f5f7;--side:#ececef;--paper:#fff;--line:#d9d9de;--text:#1d1d1f;--muted:#86868b;--acc:#e0a500;--sel:#f5d76e;--sel-text:#1d1d1f;--hover:#e0e0e5}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--side:#232325;--paper:#1c1c1e;--line:#38383a;--text:#f2f2f7;--muted:#8e8e93;--acc:#ffc93c;--sel:#6b5300;--sel-text:#fff;--hover:#2c2c2e}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;height:100vh}
aside{width:300px;flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line)}
.side-head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.brand{font-weight:700;font-size:17px;margin-right:auto}
.icon{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--acc);font-size:19px;cursor:pointer}
.icon:hover{background:var(--hover)}
.search{margin:0 14px 10px;padding:8px 12px;border-radius:9px;border:0;background:var(--hover);color:var(--text);font:inherit;font-size:14px;outline:0}
.search::placeholder{color:var(--muted)}
#list{flex:1;overflow-y:auto;padding:0 8px}
.item{padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px}
.item:hover{background:var(--hover)}
.item.on{background:var(--sel);color:var(--sel-text)}
.item .ti{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.item.on .sub{color:inherit;opacity:.75}
.item .sub b{font-weight:600;margin-right:6px}
.empty{color:var(--muted);text-align:center;font-size:13px;padding:30px 10px}
.side-foot{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.side-foot a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
.side-foot a:hover{background:var(--hover);color:var(--text)}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#34c759}
.dot.busy{background:#ff9f0a}.dot.off{background:#ff3b30}
main{flex:1;display:flex;flex-direction:column;background:var(--paper);min-width:0}
.ed-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.date{margin:0 auto;color:var(--muted);font-size:12.5px}
.back{display:none;border:0;background:transparent;color:var(--acc);font:inherit;font-size:16px;cursor:pointer;padding:6px 4px}
textarea{flex:1;width:100%;max-width:860px;margin:0 auto;border:0;outline:0;resize:none;background:transparent;color:var(--text);
padding:22px 32px;font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
textarea::placeholder{color:var(--muted)}
@media (max-width:760px){
  aside{width:100%;border-right:0}
  main{display:none}
  .app.editing aside{display:none}
  .app.editing main{display:flex}
  .back{display:block}
  textarea{padding:16px 18px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="side-head">
      <div class="brand">Catatan</div>
      <button class="icon" id="new" title="Catatan baru (Ctrl+Alt+N)">✎</button>
    </div>
    <input class="search" id="q" placeholder="Cari" autocomplete="off">
    <div id="list"></div>
    <div class="side-foot">
      <a href="/">⌂ Beranda</a>
      <a href="/logout">Keluar</a>
      <div class="sync"><span class="dot" id="dot"></span><span id="st"></span></div>
    </div>
  </aside>
  <main>
    <div class="ed-head">
      <button class="back" id="back">‹ Catatan</button>
      <span class="date" id="date"></span>
      <button class="icon" id="del" title="Hapus catatan">🗑</button>
    </div>
    <textarea id="t" placeholder="Selamat datang di PocketBridge 👋&#10;&#10;Tulis atau tempel apa saja di sini. Catatan tersimpan di HP dan otomatis muncul di semua komputer yang membuka halaman ini." spellcheck="false"></textarea>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const t = $('t'), app = $('app');
let notes = [], ver = -1, cur = null, dirty = false, lastType = 0, timer = null, saving = null;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function lines(s){return s.split('\n').map(x=>x.trim()).filter(Boolean)}
function title(n){return (lines(n.text)[0]||'Catatan Baru').slice(0,80)}
function preview(n){return (lines(n.text)[1]||'Tidak ada teks tambahan').slice(0,100)}
function when(ms){const d=new Date(ms),now=new Date();
  if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:d.getFullYear()===now.getFullYear()?undefined:'numeric'})}
function longDate(ms){return new Date(ms).toLocaleString('id-ID',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function state(s,cls){$('st').textContent=s;$('dot').className='dot'+(cls?' '+cls:'')}
function current(){return notes.find(n=>n.id===cur)}
function typing(){return dirty||Date.now()-lastType<1500}

function renderList(){
  const q=$('q').value.trim().toLowerCase();
  const shown=notes.filter(n=>!q||n.text.toLowerCase().includes(q));
  $('list').innerHTML=shown.length?shown.map(n=>
    `<div class="item${n.id===cur?' on':''}" data-id="${n.id}"><div class="ti">${esc(title(n))}</div><div class="sub"><b>${when(n.updated)}</b>${esc(preview(n))}</div></div>`
  ).join(''):`<div class="empty">${q?'Tidak ada hasil':'Belum ada catatan'}</div>`;
}
function renderEditor(){
  const n=current();
  t.value=n?n.text:'';
  $('date').textContent=n?longDate(n.updated):'';
}

async function api(method,url,body){
  const r=await fetch(url,{method,body,cache:'no-store',headers:body!=null?{'Content-Type':'text/plain;charset=utf-8'}:{}});
  if(r.status===401){location.href='/login';throw new Error('auth')}
  return r;
}

async function pull(){
  if(saving)return;
  try{
    const j=await (await api('GET','/api/notes?since='+ver)).json();
    state('Tersinkron');
    if(j.same)return;
    ver=j.v;
    const mine=current();
    notes=j.notes;
    if(cur&&typing()){
      // keep what's being typed; it will be saved shortly
      const n=current();
      if(n)n.text=t.value;else if(mine)notes.unshift(mine);
    }
    if(!current())cur=notes.length?notes[0].id:null;
    renderList();
    if(!typing())renderEditor();
  }catch(e){if(e.message!=='auth')state('HP tidak terjangkau','off')}
}

async function save(){
  clearTimeout(timer);
  if(!dirty)return;
  if(saving){await saving;return save()}
  const text=t.value;
  dirty=false;state('Menyimpan…','busy');
  saving=(async()=>{
    try{
      let r=cur?await api('PUT','/api/notes/'+cur,text):null;
      if(!r||r.status===404)r=await api('POST','/api/notes',text);
      const n=await r.json();
      const i=notes.findIndex(x=>x.id===cur);
      if(i>=0)notes.splice(i,1);
      notes.unshift({id:n.id,text:n.text,created:n.created,updated:n.updated});
      cur=n.id;ver=n.v;
      if(t.value!==text)dirty=true;
      renderList();$('date').textContent=longDate(n.updated);state('Tersimpan');
    }catch(e){dirty=true;if(e.message!=='auth')state('Gagal menyimpan','off')}
  })();
  await saving;saving=null;
  if(dirty)timer=setTimeout(save,700);
}

async function dropIfEmpty(id){
  const n=notes.find(x=>x.id===id);
  if(n&&!n.text.trim()){notes=notes.filter(x=>x.id!==id);await api('DELETE','/api/notes/'+id).catch(()=>{})}
}

async function openNote(id){
  if(id===cur){app.classList.add('editing');return}
  await save();
  const prev=cur;cur=id;
  if(prev)await dropIfEmpty(prev);
  renderList();renderEditor();app.classList.add('editing');
}

async function create(){
  await save();
  if(cur)await dropIfEmpty(cur);
  const n=await (await api('POST','/api/notes','')).json();
  ver=n.v;notes.unshift({id:n.id,text:'',created:n.created,updated:n.updated});
  cur=n.id;$('q').value='';
  renderList();renderEditor();app.classList.add('editing');t.focus();
}

async function remove(){
  if(!cur)return;
  const n=current();
  if(n&&n.text.trim()&&!confirm('Hapus catatan "'+title(n)+'"?'))return;
  clearTimeout(timer);dirty=false;
  const id=cur;
  notes=notes.filter(x=>x.id!==id);
  cur=notes.length?notes[0].id:null;
  renderList();renderEditor();app.classList.remove('editing');
  const r=await api('DELETE','/api/notes/'+id);ver=(await r.json()).v;
}

t.addEventListener('input',()=>{
  dirty=true;lastType=Date.now();state('Mengetik…','busy');
  const n=current();if(n){n.text=t.value;renderList()}
  clearTimeout(timer);timer=setTimeout(save,600);
});
t.addEventListener('blur',save);
$('list').addEventListener('click',e=>{const it=e.target.closest('.item');if(it)openNote(it.dataset.id)});
$('new').onclick=create;
$('del').onclick=remove;
$('back').onclick=async()=>{await save();if(cur)await dropIfEmpty(cur);app.classList.remove('editing');renderList()};
$('q').oninput=renderList;
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}
  if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key.toLowerCase()==='n'){e.preventDefault();create()}
});
window.addEventListener('beforeunload',()=>{if(dirty&&cur)navigator.sendBeacon('/api/notes/'+cur,new Blob([t.value],{type:'text/plain'}))});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});

pull();setInterval(pull,1500);
</script>
</body>
</html>
