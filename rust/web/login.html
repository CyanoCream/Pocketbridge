<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon.svg">
<title>Masuk · PocketBridge</title>
<style>
:root{--bg:#0b0d17;--card:#141829;--line:#262b45;--text:#e8eaf6;--muted:#8b90b0;--acc:#7c5cff;--acc2:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
background:radial-gradient(900px 500px at 15% -10%,#2a1f6b66,transparent),radial-gradient(700px 400px at 110% 110%,#0e749044,transparent),var(--bg)}
.card{width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 30px 80px #0008}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:24px;font-weight:800;margin-bottom:16px}
h1{margin:0 0 4px;font-size:22px}p{margin:0 0 24px;color:var(--muted);font-size:14px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0e1122;color:var(--text);font:inherit;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px #7c5cff33}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--acc),#5b8cff)}
.err{color:#f87171;font-size:13px;margin-top:12px;min-height:1em}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <img class="logo" src="/icon.svg" alt="">
  <h1>PocketBridge</h1>
  <p>Masukkan password yang diset di HP.</p>
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button type="submit">Masuk</button>
  <div class="err">{{ERROR}}</div>
</form>
</body>
</html>
